<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=2.0">
		<meta name="author" content="Taha, Evan, Celine">
		<title>Game Page</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='gamestyle.css') }}">
		<script>
			const JSON_URL = "{{ url_for('static', filename='characters.json') }}";
		</script>
		<script src="{{ url_for('static', filename='attack_test.js') }}" ></script>
		
		<!--FLack compatable filepath ex: <img src="{{ url_for('static', filename='images/logo.png') }}"> -->
	</head>
	<body>
		<header>
			<nav>
				<p>{{ isbn_num }}</p>
			</nav>
		</header>
		<main>
			
			<p>{{ isbn }}</p>
			<h1>Book Kinz</h1>
			<h2>Fight!</h2>
			<div class="battlefield">
				<div class="displaybox">
					<div class="wardisplay">
						<div class="fighter" id="playerChar">
							<img class="fighterimg" src="{{ url_for('static', filename='character_pictures/Harry Potter.png') }}">
							<div id="leftHealthbar">
							</div>
						</div>
						<div class="fighter" id="enemyChar">
							<img class="fighterimg" src="{{ url_for('static', filename='character_pictures/Harry Potter.png') }}">
							<div id="rightHealthbar">
							</div>
						</div>
						
					</div>
					<button id="fightBtn">Fight!</button>
				</div>
				<ul id="battleLog">
					<li class="item">
						<span class="item-text">Sample Item 1</span>
					</li>          
				</ul>
			</div>
            
		</main>
		<hr>
		<footer>
			<small>copy; Hisseine Taha, 2026. <a href="#top"> Back Up </a> </small>
		</footer>
		<hr>
	</body>
</html>

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="author" content="Taha, Evan, Celina">
		<title>Scanner Page</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
		
		<!--FLack compatable filepath ex: <img src="{{ url_for('static', filename='images/logo.png') }}"> -->
	</head>
	<body>
		<header>
			<figure>
				<img class="site-logo" src="{{ url_for('static', filename='character_pictures/site_icon.png') }}">
			</figure>
			<nav>
				<p>Bringing literature to life!</p>
			</nav>
		</header>
		<main>
			<h2>Summon your fighter</h2>
            <form method="POST" action="{{ url_for('scanner') }}" enctype="multipart/form-data">
				<fieldset>
					<legend>Scan a book's ISBN</legend>
					<p>
						<label for="image">Image</label>
		        		<input type="file" id="image" name="image" accept="image/*" capture="environemnt">
					</p>
					<p>
						<button type="submit">Upload</button>
					</p>
					
				</fieldset>
            </form>

			{% if isbn and isbn != "Invalid ISBN! Try again." %}
				<a href="{{ url_for('game') }}">Play On</a>
			{% endif %}

		</main>
		
		<footer>
			<small>&copy; Hisseine Taha, Celina Duon, Evan Pefanis, Adam Pefanis 2026. <a href="#top"> Back Up </a> </small>
		</footer>
		<hr>
	</body>
</html>
